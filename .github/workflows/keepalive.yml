name: Keepalive Workflow

# 防止 GitHub Actions 在 60 天无仓库活动后自动禁用定时工作流
# 通过 gautamkrishnar/keepalive-workflow 推送空提交制造仓库活动
# 每 50 天运行一次（每月 1 日和 21 日 UTC 1:00），远低于 60 天阈值

on:
  schedule:
    - cron: '0 1 1,21 * *'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 保持工作流活跃
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          commit_message: "Keepalive: 防止 GitHub 禁用定时工作流"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
